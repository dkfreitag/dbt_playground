
version: 2

models:
    - name: first_layer_model
      description: "Raw Citibike data"
      columns:
          - name: bikeid, starttime, stoptime
            description: "The primary key for this table"
            tests:
                - unique
                - not_null

    - name: second_layer_model
      description: "A starter dbt model"
      columns:
          - name: bikeid
            description: "The primary key for this table"
            tests:
                - not_null
